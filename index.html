  <body>
    <!--
      Holds the hero back until the preloader clears.

      The page is prerendered, so the hero is already in the HTML in its final
      state. Arming from React instead would paint the finished hero, hide it
      at hydration and animate it back in — a visible flash.

      Scroll reveals need no equivalent: GSAP sets their hidden state at
      runtime, so nothing below the fold is ever authored as hidden and a
      failed bundle simply leaves the whole page visible.

      The timeout is a failsafe. If the bundle 404s or fails to parse, React
      never releases this class and the hero would stay hidden forever.
    -->
    <script>
      ;(function () {
        var root = document.documentElement
        root.classList.add('is-loading')
        setTimeout(function () {
          if (root.dataset.booted) return
          root.classList.remove('is-loading')
          var stuck = document.getElementById('preloader')
          if (stuck) stuck.remove()
          document.body.style.overflow = ''
        }, 3000)
      })()
    </script>

    <!--
      The preloader covers content that already exists; it does not gate it. The
      hero is fully rendered in the prerendered HTML behind this panel.

      It is `display: none` in CSS and only made visible by initPreloader, so a
      JavaScript failure means no loader rather than a permanently blocked page.
      It also runs on first visit only — a loader a returning visitor sits
      through twice is a tax, not an effect.
    -->
    <div id="preloader">
      <span class="preloader__mark">Ghassen Zaara&#174;</span>
      <span id="preloader-count">000</span>
      <span id="preloader-bar"></span>
    </div>

    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
